interface:
  display_name: "ThinkGeo Desktop Maps"
  short_description: "Build WPF and WinForms map apps with ThinkGeo"
  default_prompt: "Help me build this ThinkGeo desktop map."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
