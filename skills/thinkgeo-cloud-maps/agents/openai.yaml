interface:
  display_name: "ThinkGeo Cloud Maps"
  short_description: "Use ThinkGeo Cloud basemaps, geocoding, routing, and other services"
  default_prompt: "Help me add ThinkGeo Cloud services to this app."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
