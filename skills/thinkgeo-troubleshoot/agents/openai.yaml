interface:
  display_name: "ThinkGeo Troubleshooter"
  short_description: "Diagnose ThinkGeo errors and unexpected behavior"
  default_prompt: "Diagnose this ThinkGeo problem using current documentation and samples."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
