interface:
  display_name: "ThinkGeo Code Review"
  short_description: "Review ThinkGeo .NET code against current APIs"
  default_prompt: "Review this ThinkGeo code against current documentation and official samples."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
