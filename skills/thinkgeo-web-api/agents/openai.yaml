interface:
  display_name: "ThinkGeo WebAPI"
  short_description: "Build ASP.NET Core map tile services with ThinkGeo WebAPI"
  default_prompt: "Help me serve map tiles from ASP.NET Core with ThinkGeo."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
