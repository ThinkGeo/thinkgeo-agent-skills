interface:
  display_name: "ThinkGeo Blazor"
  short_description: "Build Blazor map pages with ThinkGeo"
  default_prompt: "Help me add a ThinkGeo map to this Blazor page."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
