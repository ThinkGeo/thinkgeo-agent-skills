interface:
  display_name: "ThinkGeo Desktop Interaction"
  short_description: "Add identify, query, draw, and edit tools to desktop maps"
  default_prompt: "Add this interactive feature to my ThinkGeo desktop map."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
