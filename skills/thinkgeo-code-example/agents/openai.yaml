interface:
  display_name: "ThinkGeo Code Example"
  short_description: "Build source-verified ThinkGeo .NET examples"
  default_prompt: "Build this ThinkGeo feature using current docs and official samples."
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "thinkgeo-docs"
      description: "Search and retrieve current ThinkGeo documentation and official sample source."
      transport: "streamable_http"
      url: "https://ai.thinkgeo.com/mcp"
